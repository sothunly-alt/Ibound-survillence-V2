<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbound Surveillance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #0c1322;
      color: #dce2f7;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
    }
    .boot {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      text-align: center;
    }
    .mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px;
      color: #a4c9ff;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: -0.03em;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: #c1c7d3;
      font-size: 14px;
      line-height: 1.5;
    }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #60a5fa;
      margin: 20px auto 0;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <main class="boot">
    <div class="card">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="12.5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="5" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16" cy="16" r="1.8" fill="currentColor"/>
      </svg>
      <h1>Inbound Surveillance</h1>
      <p id="status">Starting local camera engine…</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </main>
  <script type="module" src="/src/desktop.tsx"></script>
</body>
</html>
