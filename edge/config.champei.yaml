venue: Champei Spa
# Must be "garage" or "massage" (WORKPLACE_IDS in edge/workplaces/__init__.py).
# Any other value silently falls back to "garage" and yields garage zones/UI.
workplace_type: massage
branch_id: champei-pp-01
source: videos/document_6161011834561243252.mp4

cameras:
  - id: champei-entrance-01
    name: Entrance & Guard Post
    camera_role: entrance
    source: videos/document_6161011834561243252.mp4
    protocol: file
    vendor: generic
    rotate: 0
    flip: none
    roi: [0.05, 0.06, 0.88, 0.94]
    bays:
      - id: guard_station
        name: Security Guard Post
        roi: [0.30, 0.36, 0.39, 0.64]
        type: staff_zone
      - id: customer_walkway
        name: Customer Entrance Walkway
        roi: [0.05, 0.35, 0.35, 0.60]
        type: entrance
    enabled: true
    ml_enabled: true

active_camera_id: champei-entrance-01

# Vendor (Inbound Surveillance) shared alert bot. The operator connects their own
# Telegram chat to this bot in one click (Settings -> Integrations -> Connect
# Telegram -> tap Start). The linked chat id is saved to telegram_chat_id below
# automatically; leave it empty for a fresh install.
telegram_bot_token: "8987540090:AAEntu6IaceRsrnNl0Eow7ZrOYHBR90FkZU"
telegram_chat_id: ""

runtime: cpu
pose_engine: yolo
weights: yolo11n-pose.pt
imgsz: 960
person_conf: 0.25
kpt_conf: 0.35

# Role & Guard Classifier Settings
role_classifier:
  enabled: true
  guard_dwell_seconds: 15.0
  guard_zone_roi: [0.30, 0.36, 0.39, 0.64]
  auto_suppress_guard_visits: true

# Customer Shoe-Change / Flip-Flop Station Monitor
shoe_change_zone:
  enabled: true
  zone: [0.05, 0.40, 0.45, 0.95]
  wrist_ankle_dist: 0.08
  confirm_seconds: 1.2
  cooldown_seconds: 30.0
  proofs: true

# Customer Visit Analytics
# Massage/spa deployments must not retain customer biometrics.
# try_create_face_recognizer() honours enable_face_id independently of
# workplace_type, so leaving this true does run face recognition.
enable_face_id: false
store_customer_avatars: false
face_match_threshold: 0.38
door_monitor:
  enabled: true
  line_x: 0.55
  zone: [0.50, 1.00]
  enter_direction: right_to_left
  confirm_obs: 3
  cooldown_seconds: 20.0
  leave_seconds: 5.0
  relink_seconds: 30.0
  relink_distance: 0.28
  motion_confirm: false
  motion_thresh: 2.5
  max_sessions: 2
  proofs: true


