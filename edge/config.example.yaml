# Copy to config.yaml (gitignored) and fill Telegram fields,
# or set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in the environment.
#
# source: 0 = default webcam. Or an RTSP URL from the NVR, e.g.
#   rtsp://USER:PASS@192.168.1.64:554/Streaming/Channels/101
#   rtsp://USER:PASS@192.168.1.108:554/cam/realmonitor?channel=1&subtype=0
# Phone (IP Webcam) — same Wi-Fi as this PC. Use the video path, not the web page:
#   http://PHONE_IP:8080/video
# If the app has a username/password, fill those fields. IP Webcam uses HTTP Digest
# (browsers handle it; a raw OpenCV URL does not).

venue: Demo Garage
garage_name: Demo Garage
workplace_type: garage
# Spa / multi-branch installs set these (ignored by garage tooling until wired):
# branch_id: champei-pp-01
# store_customer_avatars: false
# enable_face_id: false
source: 0

# Named cameras added in the hub. Empty until the operator saves one.
cameras: []
# Example dual-stream camera (AI sub-stream + evidence main stream):
# cameras:
#   - id: cam-01
#     name: Front Desk
#     camera_role: front_desk
#     source: rtsp://USER:PASS@192.168.1.64:554/Streaming/Channels/102
#     main_source: rtsp://USER:PASS@192.168.1.64:554/Streaming/Channels/101
#     protocol: rtsp
#     vendor: hikvision
active_camera_id: ""

# Degrees clockwise. auto = 90 for phone HTTP (IP Webcam), 0 for PC webcam / RTSP.
# Or set 0 / 90 / 180 / 270. Live: press o to cycle this session.
rotate: auto
# none | h | v  (selfie / front-camera mirror if needed). Live: press m.
flip: none

# Legacy single ROI (kept in sync with bays[0]). Prefer the bays list below.
roi: [0.10, 0.20, 0.35, 0.60]

# Named service-bay ROIs as fractions of the frame: [x, y, width, height]
# Drag boxes on the live feed to create, move, or resize bays.
bays:
  - {id: bay_1, name: Lift Bay 1, roi: [0.10, 0.20, 0.35, 0.60], type: vehicle_bay}
  - {id: bay_2, name: Bay 2 (Brakes/Tires), roi: [0.55, 0.20, 0.35, 0.60], type: vehicle_bay}
  - {id: tools, name: Tool Station, roi: [0.42, 0.05, 0.16, 0.20], type: tool_area}

# Mechanic phones on garage Wi-Fi (MAC and/or static IP from the ARP table).
wifi_devices: []

# Person detector — RTMPose (YOLOX person boxes + COCO-17 skeletons).
# Staff = connected kinematic skeleton OR a close-up face (laptop webcam).
# Shoes, bags, and jackets fail: no head/torso tree. Blankets still fail.
# detect_fps caps inference; the preview still follows the camera.
# Dual-target runtime: cpu | openvino | cuda | tensorrt
#   cpu      = ONNX Runtime. Best on AMD/ARM edge boxes.
#   openvino = OpenVINO 2026.x, pre-installed and already wired through
#              runtime.py + rtmpose.py. Only faster on Intel CPUs (VNNI/AVX512);
#              measured 0.89x, i.e. slower, on an AMD Ryzen 3 3250U, so leave
#              this on cpu unless the box is Intel.
# imgsz 960 keeps far 1080p workers large enough; set 1280 on cuda/tensorrt.
runtime: cpu
# Inference thread budget. Omit to auto-detect *physical* cores. Do not set this
# to the logical CPU count: ONNX Runtime's intra-op pool scales badly past
# physical cores (measured 1.42x slower at 4 threads vs 2 on a 2c/4t Ryzen 3).
# num_threads: 2
# Pose backend: "rtmpose" (OpenMMLab RTMPose via rtmlib), "yolo" (YOLO11n-pose),
# or "tinypose" (PP-TinyPose). Vehicle boxes still use Ultralytics YOLO.
pose_engine: rtmpose
# lightweight = YOLOX-tiny+RTMPose-s (CPU). balanced = YOLOX-m+RTMPose-m.
rtmpose_mode: lightweight
weights: yolo11n-pose.pt  # Fallback if RTMPose cannot load; yolo11n_improved.pt is detect-only
server_weights: yolo11s-pose.pt
person_conf: 0.25
imgsz: 960
min_person_height: 0.05
min_aspect: 1.1
min_keypoints: 3
kpt_conf: 0.35  # Joint floor for RTMPose / YOLO-pose. Omit this key for TinyPose (defaults to 0.12).
# Zoom empty vehicle bays (SAHI-style crop) when full-frame YOLO misses a crouch.
bay_zoom: true
bay_zoom_pad: 0.08
detect_fps: 15
# Decouple vehicle YOLO cadence from person pose (seconds between vehicle checks)
vehicle_infer_interval: 1.0
occupy_confirm_seconds: 1.0
occupy_clear_seconds: 5.0
# Keep WORKING while a mechanic ducks under a car; then ON_BREAK.
under_car_grace_seconds: 30
idle_stationary_seconds: 120
clock_out_seconds: 600

# ByteTrack-style identity continuity (head turns / brief occlusion).
enable_reid: true
reid_match_threshold: 0.50
# Set true to fetch OSNet ONNX on first run (needs internet). Otherwise a
# local clothing-histogram embedding is used until you drop the file in models/.
reid_download: false
track_max_age: 90
track_min_hits: 3
track_iou_threshold: 0.3
track_low_thresh: 0.10

# Product default is 180. Use ~10 so mentors do not wait.
# Per-camera idle-bay wait lives on cameras[].absent_seconds; this global is the fallback.
absent_seconds: 10
cooldown_seconds: 30
sample_fps: 30

# Shop operating hours (local time) for utilization % and open/closed badge.
open_time: "08:00"
close_time: "18:00"
operating_hours:
  open: "08:00"
  close: "18:00"

# Pipeline graph IR from the dashboard editor. When present, node kinds gate
# person/vehicle/face/re-ID, monitors, persist, and Telegram dispatch.
# Invalid graphs do not start inference.
# pipeline_graph: {}

# Local face ID (YuNet + SFace). Put staff photos in faces/<Name>/*.jpg
# (several angles help). Unknown people overlay as Customer.
# Massage / spa: keep enable_face_id false and store_customer_avatars false
# (embeddings + opaque visitor_* ids only — no visitor JPEGs).
enable_face_id: true
store_customer_avatars: true
faces_dir: "faces"
models_dir: "models"
# Cosine similarity floor for SFace 128-d embeddings (face_id.CustomerFaceGallery
# default is 0.38, the OpenCV-zoo SFace operating point). Raising this to 0.60
# makes the same guest re-enroll as a brand-new customer on every visit, which
# silently inflates customer counts and breaks retention / churn reporting.
face_match_threshold: 0.38

# Prefer env vars TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID (never commit real tokens).
telegram_bot_token: ""
telegram_chat_id: ""
# Optional customer group. Add the bot to the group and send /start there; alerts
# for this site are then delivered to the group as well. Env: TELEGRAM_GROUP_CHAT_ID.
telegram_group_chat_id: ""

# Optional zero-touch remote updates. When enabled, the engine polls a Supabase
# table (default "edge_site_config") for this site_key and applies any changed
# Telegram fields (token / chat id / group chat id) automatically. This lets an
# operator retarget a remote customer's alerts without touching their machine.
# The table needs a public read policy for the site_key row.
cloud_sync:
  enabled: false
  url: ""            # https://<project>.supabase.co
  anon_key: ""       # public anon key
  site_key: ""       # opaque per-site token; must match the table row
  table: edge_site_config
  interval_seconds: 60

# Spa lobby door traffic: times when customers cross the entrance so each visit
# gets an enter/exit pair and a dwell time. Two signals, either one is enough:
#   line_x  vertical tripwire (direction of travel decides enter vs exit)
#   zone    door-side horizontal band [x1, x2] normalized; a track appearing
#           inside it counts as ENTER, an entered track vanishing from it as EXIT
# enter_direction: right_to_left means the door is on the RIGHT of the frame and
# guests walk right -> left to come in. Flip to left_to_right if the door is on
# the left. verify with one real walk-through before trusting the numbers.
door_monitor:
  enabled: false
  line_x: 0.55
  zone: [0.50, 1.00]
  enter_direction: right_to_left
  confirm_obs: 3
  cooldown_seconds: 20.0
  leave_seconds: 5.0
  relink_seconds: 30.0
  relink_distance: 0.28
  motion_confirm: false
  motion_thresh: 2.5
  max_sessions: 2
  proofs: true

# Spa shoe-change / flip-flop station: visitors taking off street shoes and
# putting on indoor flip-flops at the rack is a strong CUSTOMER signal (staff
# never change footwear there). The monitor fires a customer_shoe_change event
# after a visitor spends >= confirm_seconds in a reach-down posture (hands at
# feet) with their bbox center inside the zone.
# zone: normalized [x1, y1, x2, y2] covering the shoe bench / rack area.
# wrist_ankle_dist: hands-feet distance as a fraction of the frame diagonal.
# require_person: also require head + shoulder keypoints (rejects shoe clutter).
shoe_change_zone:
  enabled: false
  zone: [0.40, 0.40, 0.70, 1.0]
  wrist_ankle_dist: 0.06
  confirm_seconds: 1.5
  cooldown_seconds: 30.0
  leave_seconds: 4.0
  kpt_conf: 0.30
  require_person: true
  proofs: true

# Customer Complaint Detection (audio) — Silero VAD + Khmer Whisper + Ollama.
# Default: on for massage / a deployed "Complaint intake" pipeline node.
# Set enabled: true|false to override that. Garage stays off unless you opt in.
# audio_source_type: laptop | usb | camera | video
# video_loop: true = keep monitoring an uploaded clip's audio (loops).
# stt_model_size: fine-tuned Khmer model id or legacy size ("base" -> sengtha/whisper-base-khmer).
complaint_monitoring:
  audio_source_type: laptop
  device_index: null
  vad_threshold: 0.35
  vad_min_speech_duration_ms: 400
  vad_max_speech_duration_s: 30.0
  stt_model_size: sengtha/whisper-base-khmer
  stt_language: km
  ollama_model: qwen2.5:3b
  ollama_host: http://localhost:11434
  telegram_alert_enabled: true
  telegram_min_severity: low
  video_loop: true
  dedup_window_seconds: 60

# Tier 2 AI Auditor (Fireworks VLM)
fireworks_api_key: ""
fireworks_model: "accounts/fireworks/models/deepseek-v4-flash-vision-exp"
