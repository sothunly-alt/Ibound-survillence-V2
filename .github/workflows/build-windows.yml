name: Build Windows Desktop App

on:
  push:
    branches:
      - camera-detection
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .env configuration
        shell: bash
        run: |
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://rmepwjywobowktdmkusu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZXB3anl3b2Jvd2t0ZG1rdXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDA0MDYsImV4cCI6MjEwNDMxNjQwNn0.u_hg9uXPSK7AE1kD3ol9LUmYgyddVWrELACWh5Z9zr4' }}
          FIREWORKS_API_KEY=${{ secrets.FIREWORKS_API_KEY || '' }}
          FIREWORKS_MODEL=${{ secrets.FIREWORKS_MODEL || 'accounts/fireworks/models/deepseek-v4-flash-vision-exp' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN || '8987540090:AAEntu6IaceRsrnNl0Eow7ZrOYHBR90FkZU' }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID || '' }}
          EOF
          cp .env edge/.env

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r edge/requirements.txt pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Python sidecar binary
        shell: bash
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: python edge/build_sidecar.py --target x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Pre-fetch NSIS
        shell: powershell
        run: |
          $dir = "$env:LOCALAPPDATA\tauri\NSIS-3.11"
          New-Item -ItemType Directory -Force -Path $dir
          $zip = "$dir\nsis-3.11.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" -OutFile $zip
          }
          Expand-Archive -Path $zip -DestinationPath $dir -Force

      - name: Build Tauri Windows bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: v__VERSION__
          releaseName: Inbound Surveillance Windows v__VERSION__
          releaseBody: |
            Automated release for Inbound Surveillance desktop application.
            *Note:* If the camera engine fails to launch on Windows, please install the [Microsoft Visual C++ 2015–2022 Redistributable (x64)](https://aka.ms/vs/17/release/vc_redist.x64.exe).
          releaseDraft: true
          prerelease: false

      - name: Upload Windows bundle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbound-surveillance-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
