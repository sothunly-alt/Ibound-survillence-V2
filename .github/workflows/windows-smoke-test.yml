name: Windows Smoke Test

# Installs the real shipped NSIS package on a genuine Windows host, boots the
# Python engine, exercises the HTTP API, launches the Tauri GUI, then uninstalls.
#
# Deliberately NOT on camera-detection/main, so pushing this file does not
# re-trigger the 15-minute production build.

on:
  # A push trigger is read from the pushed commit, so this works while the
  # workflow lives on a side branch. workflow_dispatch only becomes available
  # once the file reaches the default branch (main).
  push:
    branches:
      - windows-smoke-test
    paths:
      - "scripts/windows-smoke-test.ps1"
      - ".github/workflows/windows-smoke-test.yml"
      # The test deploys and asserts this file, so config edits must re-run it.
      - "edge/config.champei.yaml"
      # The test feeds this clip through the engine to exercise ML on Windows.
      - "scripts/fixtures/sample_test_clip.mp4"
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run id of the Build Windows Desktop App run to test (blank = latest successful)"
        required: false
        default: ""
      expected_version:
        description: "Expected version (blank = read from the installer filename)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve which build to test
        id: resolve
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "$env:GITHUB_REPOSITORY"

          if ([string]::IsNullOrWhiteSpace($env:INPUT_RUN_ID)) {
            $runs = gh run list -R $repo --workflow "build-windows.yml" --status success --limit 1 `
                     --json databaseId,displayTitle,headBranch | ConvertFrom-Json
            $run = $runs | Select-Object -First 1
            if (-not $run) { throw "No successful build-windows.yml run found." }
            $runId = "$($run.databaseId)"
            Write-Host "Latest successful build run: $runId on '$($run.headBranch)' - $($run.displayTitle)"
          } else {
            $runId = $env:INPUT_RUN_ID
            Write-Host "Requested build run: $runId"
          }

          $json = gh api "repos/$repo/actions/runs/$runId/artifacts" | ConvertFrom-Json
          $artifact = $json.artifacts |
                      Where-Object { $_.name -eq "inbound-surveillance-windows-installer" } |
                      Select-Object -First 1
          if (-not $artifact) { throw "Artifact not found on run $runId" }

          "run_id=$runId"              >> $env:GITHUB_OUTPUT
          "artifact_name=$($artifact.name)" >> $env:GITHUB_OUTPUT
          Write-Host ("Artifact: {0} (id {1}, {2} MB)" -f $artifact.name, $artifact.id, [math]::Round($artifact.size_in_bytes/1MB,1))

      - name: Download installer bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "artifact"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # gh run download writes files itself - never pipe a binary zip
          # through PowerShell redirection, which corrupts it.
          gh run download $env:RUN_ID -R "$env:GITHUB_REPOSITORY" `
             --name $env:ARTIFACT_NAME --dir $dest
          Get-ChildItem -Recurse $dest -File | ForEach-Object {
            Write-Host ("  {0}  ({1} MB)" -f $_.FullName.Replace($dest,"."), [math]::Round($_.Length/1MB,1))
          }

      - name: Locate NSIS setup executable and read its version
        id: locate
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path "$env:RUNNER_TEMP\artifact" -Recurse -Filter "*_x64-setup.exe" |
                   Select-Object -First 1
          if (-not $setup) { throw "No *_x64-setup.exe inside the downloaded artifact" }

          Write-Host "Installer: $($setup.Name) ($([math]::Round($setup.Length/1MB,1)) MB)"

          # "Inbound Surveillance_0.1.5_x64-setup.exe" -> 0.1.5
          $parsed = ""
          if ($setup.Name -match '_([0-9]+\.[0-9]+\.[0-9]+)_x64-setup\.exe$') { $parsed = $Matches[1] }

          $expected = $env:INPUT_VERSION
          if ([string]::IsNullOrWhiteSpace($expected)) { $expected = $parsed }

          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw "Could not determine expected version (input='$($env:INPUT_VERSION)', parsed='$parsed')"
          }
          if ($parsed -and $parsed -ne $expected) {
            Write-Host "::warning::Filename says $parsed but expecting $expected"
          }

          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "version=$expected"     >> $env:GITHUB_OUTPUT
          Write-Host "Expected build version: $expected"

      - name: Run install + launch smoke test
        shell: pwsh
        env:
          INSTALLER: ${{ steps.locate.outputs.path }}
          VERSION: ${{ steps.locate.outputs.version }}
        run: |
          # Deploy the real customer config so the test exercises the exact
          # settings the customer ships with, not just the bundled default.
          ./scripts/windows-smoke-test.ps1 `
            -Installer $env:INSTALLER `
            -ExpectedVersion $env:VERSION `
            -ConfigFile "edge/config.champei.yaml" `
            -VideoFile "scripts/fixtures/sample_test_clip.mp4"

      - name: Upload smoke test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 14
