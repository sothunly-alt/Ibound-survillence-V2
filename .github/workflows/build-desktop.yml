name: Build Cross-Platform Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .env configuration
        shell: bash
        run: |
          cat << 'EOF' > .env
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://rmepwjywobowktdmkusu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtZXB3anl3b2Jvd2t0ZG1rdXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDA0MDYsImV4cCI6MjEwNDMxNjQwNn0.u_hg9uXPSK7AE1kD3ol9LUmYgyddVWrELACWh5Z9zr4' }}
          FIREWORKS_API_KEY=${{ secrets.FIREWORKS_API_KEY || '' }}
          FIREWORKS_MODEL=${{ secrets.FIREWORKS_MODEL || 'accounts/fireworks/models/deepseek-v4-flash-vision-exp' }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN || '8987540090:AAEntu6IaceRsrnNl0Eow7ZrOYHBR90FkZU' }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID || '' }}
          EOF
          cp .env edge/.env

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge/requirements.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r edge/requirements.txt pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libglib2.0-dev pkg-config

      - name: Fetch Visual C++ Redistributable
        if: runner.os == 'Windows'
        run: node scripts/fetch-vc-redist.mjs

      - name: Build Python sidecar binary
        shell: bash
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: python edge/build_sidecar.py --target ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: Inbound Surveillance v__VERSION__
          releaseBody: |
            Automated release for Inbound Surveillance.

            **Windows:** install the `-setup.exe`. It detects and installs WebView2 and the Visual C++ runtime if they are missing.

            **Linux (Ubuntu/Debian):** install the `.deb` with `sudo apt install ./Inbound*.deb`. APT pulls in WebKitGTK, OpenMP, and the other libraries the camera engine needs.

            **Linux (other distros):** download the `.AppImage`, then `chmod +x` it. If it fails with a FUSE error, install `libfuse2`.
          releaseDraft: true
          prerelease: false

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbound-surveillance-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
